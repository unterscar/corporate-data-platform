name: Corporate Data Platform CI
on:
  push:
    branches:
      - main
      - feature-ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project source code
        uses: actions/checkout@v5

      - name: Check Python syntax
        run: python -m py_compile app/app.py

      - name: Build Docker image
        run: docker build -t corporate-data-app:ci ./app
