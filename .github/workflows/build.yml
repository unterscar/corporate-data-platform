name: Corporate Data Platform CI

on:
  push:
    branches:
      - main
      - feature-ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project source code
        uses: actions/checkout@v5

      - name: Check Python syntax
        run: python -m py_compile app/app.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/corporate-data-platform:ci

      - name: Build and publish Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/corporate-data-platform:latest
            ghcr.io/${{ github.repository_owner }}/corporate-data-platform:${{ github.sha }}
