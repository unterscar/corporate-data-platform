apiVersion: apps/v1
kind: Deployment
metadata:
  name: corporate-data-deployment
  annotations:
    kubernetes.io/change-cause: "Release 2.2.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: corporate-data-app
  template:
    metadata:
      labels:
        app: corporate-data-app
      annotations:
        app-version: "2.2.0"
    spec:
      containers:
        - name: corporate-data-app
          image: ghcr.io/unterscar/corporate-data-platform:2.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: corporate-data-config
          env:
            - name: DB_PASSWORD
              value: "corporate_password"

